[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fpnode"
version = "0.1.0"
description = "Neural-ODE vector fields with exactly prescribed equilibria (QR / pseudoinverse parametrization)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]
tutorials = ["notebook"]

[tool.setuptools.packages.find]
where = ["src"]
